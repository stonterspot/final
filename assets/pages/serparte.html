<!-- FORMULARIO DE DATOS -->
<main>
<form action="formcontenedor">

        <div class="formulario">
            <h2>¿Te interesaria trabajar para nosostros?</h2>

            <div class="form-group">
                <label for="nombre">Nombre y apellido</label>
                <input type="tel" id="nombre" name="nombre" required>
            </div>

            <div class="form-group">
                <label for="nacimiento">Fecha de nacimiento (01/01/2025):</label>
                <input type="tel" id="nacimiento" name="nacimiento" required>
            </div>

                <div class="form-group">
                    <label for="celular">Número celular:</label>
                    <input type="tel" id="celular" name="celular" required>
                </div>
    
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
    
                <div class="form-group">
                    <label for="info">¿Cuales son tus habilidades laborales?</label>
                    <textarea id="info" name="info" required></textarea>
                </div>
                <input type="submit" value="Enviar">
        </div>
    </form>      
<!-- FIN FORMULARIO DE DATOS -->
